
# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/src/ledger/db/migrations

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = %(here)s/src

# path separator for lists of paths.
path_separator = os

# database URL is supplied by src/ledger/db/migrations/env.py
# from the application settings.
sqlalchemy.url =


[post_write_hooks]


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

