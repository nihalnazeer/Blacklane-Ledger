
[project]
name = "blacklane-ledger-backend"
version = "0.1.0"
description = "FastAPI backend for Blacklane Ledger"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "greenlet>=3.5.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-ignore = ["B008"]

